<svg width="120" height="132" viewBox="0 0 120 132" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VA ClaimMate logo">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3949ab"/>
      <stop offset="1" stop-color="#1a237e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#ffc107"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1a237e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Shield body -->
  <path d="M60 5 L108 21 V58 C108 89 87 113 60 127 C33 113 12 89 12 58 V21 Z"
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4"
        stroke-linejoin="round" filter="url(#softShadow)"/>

  <!-- Three stars arching across the top -->
  <g fill="url(#goldGrad)">
    <path d="M34 33 l2.1 4.6 5 .5 -3.8 3.4 1.1 4.9 -4.4 -2.6 -4.4 2.6 1.1 -4.9 -3.8 -3.4 5 -.5 Z"/>
    <path d="M60 28 l2.4 5.2 5.7 .6 -4.3 3.8 1.3 5.6 -5.1 -3 -5.1 3 1.3 -5.6 -4.3 -3.8 5.7 -.6 Z"/>
    <path d="M86 33 l2.1 4.6 5 .5 -3.8 3.4 1.1 4.9 -4.4 -2.6 -4.4 2.6 1.1 -4.9 -3.8 -3.4 5 -.5 Z"/>
  </g>

  <!-- Checkmark -->
  <path d="M37 68 L53 85 L86 49"
        fill="none" stroke="url(#goldGrad)" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
